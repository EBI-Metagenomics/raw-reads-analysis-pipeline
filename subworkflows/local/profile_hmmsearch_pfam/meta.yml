# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "profile_hmmsearch_pfam"
description: Translate reads to ORFs, search them against Pfam-A with `hmmsearch` or nail and HMMER, and count reads per model
keywords:
  - pfam
  - hmmsearch
  - nail
components:
  - seqkit/translate
  - hmmer/hmmsearch
input:
  - reads_fasta:
      type: file
      description: |
        Reads in FASTA format
        Structure: [ val(meta), path(fasta) ]
      pattern: "*.{fasta,fa}{,.gz}"
  - pfam_db:
      type: file
      description: Pfam-A HMM file
      pattern: "*.hmm"
output:
  - profile:
      type: file
      description: |
        Read count, coverage depth and breadth per model
        Structure: [ val(meta), path(tsv) ]
      pattern: "*_pfam_coverage.tsv"
  - stats:
      type: file
      description: |
        Mapping statistics
        Structure: [ val(meta), path(json) ]
      pattern: "*_stats.json"
  - alignments:
      type: file
      description: |
        Alignments of GA-passing domains, only when `pfam_search_engine` is `nail`
        Structure: [ val(meta), path(parquet) ]
      pattern: "*_alignments.parquet"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@timrozday-mgnify"
